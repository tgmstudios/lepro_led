name: Validate for HACS
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # No brand assets are bundled and the integration is not in home-assistant/brands.
          # Remove this once brand/icon.png is added or the domain is registered.
          ignore: brands
