name: Validate for HACS
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # No brand assets are bundled and the integration is not in home-assistant/brands.
          # Remove this once brand/icon.png is added or the domain is registered.
          # License exception (documented in README): the upstream LICENSE.md
          # (Sanji78/lepro_led) currently reads "All Rights Reserved", which HACS
          # cannot map to an SPDX id. We do NOT relicense or alter it. This fork is
          # therefore not eligible for the default HACS catalogue until upstream
          # clarifies its terms; it is installable only as a custom repository.
          # All other HACS checks still run and must pass.
          ignore: brands license
