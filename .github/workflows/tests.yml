name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install pytest-homeassistant-custom-component aiomqtt
      - name: Run tests
        run: python -m pytest -q -W error::RuntimeWarning
