set_segments:
  name: Set segment colours
  description: >-
    Paint the 25 segments of an S1-5 strip. 1-25 RGB colours are spread in even blocks
    (e.g. two colours = 13 + 12 segments). Uses the same d50 colour string as the segment lights.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: lepro_led
          domain: light
          multiple: true
    colors:
      required: true
      example: "[[255,0,0],[0,0,255]]"
      selector:
        object:

set_scene:
  name: Set scene
  description: >-
    Apply one of the six verified DIY effects with a custom colour palette, speed and brightness in a
    single command. Colours are spread in even blocks over the 25 segments. Fields you leave out keep
    their current value. Palette, speed or direction changes in music mode need an explicit DIY effect;
    brightness-only does not. The palette is supplied in this call and commands use cloud MQTT;
    this service does not read or save Lepro cloud scenes. Multi-strip calls are not distributed transactions.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: lepro_led
          domain: light
          multiple: true
    effect:
      example: gradient
      selector:
        select:
          options: [solid, breath, gradient, clockwise, counterclockwise, circular]
    colors:
      example: "[[255,0,0],[0,0,255]]"
      selector:
        object:
    speed:
      description: Effect speed 0-100 (stored but not sent for solid).
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    brightness:
      description: Brightness 1-255 (not together with brightness_pct).
      selector:
        number:
          min: 1
          max: 255
    brightness_pct:
      description: Brightness 1-100 percent (not together with brightness).
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    direction:
      description: Sets clockwise/counterclockwise direction for a directional effect; must match an explicitly provided effect.
      selector:
        select:
          options: [clockwise, counterclockwise]

apply_cloud_scene:
  name: Apply cloud scene
  description: >-
    Apply a saved Lepro cloud scene (read from your account, listed on the strip's cloud scene select
    entity) by its stable scene_id. The server-provided d50 string is replayed unchanged; one MQTT command
    per strip. This is different from set_scene, which builds a local palette. Brightness is left alone
    unless given.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: lepro_led
          domain: light
          multiple: true
    scene_id:
      required: true
      example: cid-123
      description: Stable id shown in the select entity's scene_ids attribute.
      selector:
        text:
    brightness:
      selector:
        number:
          min: 1
          max: 255
    brightness_pct:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

refresh_cloud_scenes:
  name: Refresh cloud scenes
  description: Re-read the saved cloud scene catalog for the given strips (read-only request, only when called).
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: lepro_led
          domain: light
          multiple: true
